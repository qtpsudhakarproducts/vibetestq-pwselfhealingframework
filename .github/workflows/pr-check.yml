# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# PR Check — Smoke Suite
name: PR Check — Smoke Suite

on:
  pull_request:
    branches:
      - main

jobs:
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Create auth directory
        run: mkdir -p playwright/.auth

      - name: Create environment file
        run: |
          mkdir -p test-data
          cat > test-data/.env.dev << 'EOF'
          BASE_URL=${{ vars.BASE_URL }}
          ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          ESS_USERNAME=${{ secrets.ESS_USERNAME }}
          ESS_PASSWORD=${{ secrets.ESS_PASSWORD }}
          EOF

      - name: Run smoke suite
        run: npx playwright test --grep @smoke
        env:
          CI: true
          TEST_ENV: dev
          ENABLE_RUNTIME_HEALING: 'true'
          HEAL_LLM_PROVIDER: 'ollama-cloud'
          OLLAMA_CLOUD_API_KEY: ${{ secrets.OLLAMA_CLOUD_API_KEY }}
          OLLAMA_CLOUD_MODEL: 'gemma3:4b'
          OLLAMA_CLOUD_HOST: 'https://ollama.com'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pr-${{ github.run_number }}
          path: reports/html/
          retention-days: 7
