name: Playwright Tests + Smart Report

on:
  push:
    branches: [advreport, main]
  pull_request:
    branches: [advreport, main]
  schedule:
    - cron: '0 6 * * 1-5'      # Weekday 6am UTC — nightly regression run
  workflow_dispatch:             # Manual trigger from Actions tab

permissions:
  contents: write                # push history/ and gh-pages commits
  pages: write
  id-token: write

jobs:
  test:
    name: Run Tests & Publish Report
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      # ── 2. Node.js setup ───────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # ── 4. Restore test history (cache fast-path) ──────────────────────────
      - name: Restore test history from cache
        uses: actions/cache/restore@v4
        id: history-cache
        with:
          path: test-history-orangehrm-ui.json
          key: test-history-${{ github.ref_name }}
          restore-keys: |
            test-history-advreport
            test-history-

      # ── 5. Restore test history (repo fallback) ────────────────────────────
      - name: Restore test history from repository (fallback)
        if: steps.history-cache.outputs.cache-hit != 'true'
        run: |
          if [ -f history/test-history-orangehrm-ui.json ]; then
            cp history/test-history-orangehrm-ui.json test-history-orangehrm-ui.json
            echo "✅ History restored from committed file ($(wc -c < test-history-orangehrm-ui.json) bytes)"
          else
            echo "ℹ️  No prior history found — this is the first run"
          fi

      # ── 6. Run Playwright tests ────────────────────────────────────────────
      - name: Run Playwright tests
        run: npx playwright test
        continue-on-error: true        # don't abort — we still want to publish results
        env:
          CI: true
          GITHUB_RUN_ID: ${{ github.run_id }}

      # ── 7. Save updated history to cache ──────────────────────────────────
      - name: Save test history to cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: test-history-orangehrm-ui.json
          key: test-history-${{ github.ref_name }}-${{ github.run_id }}

      # ── 8. Commit history to repository (permanent backup) ────────────────
      - name: Commit test history to repository
        if: always() && (github.ref == 'refs/heads/advreport' || github.ref == 'refs/heads/main')
        run: |
          mkdir -p history
          cp test-history-orangehrm-ui.json history/test-history-orangehrm-ui.json
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add history/test-history-orangehrm-ui.json
          git diff --staged --quiet && echo "No history changes to commit" || \
            (git commit -m "chore: update test history [run #${{ github.run_number }}] [skip ci]" && git push origin HEAD:${{ github.ref_name }})

      # ── 9. Prepare GitHub Pages content ───────────────────────────────────
      - name: Prepare GitHub Pages content
        if: always()
        run: |
          # Smart report lives under smart/ subdirectory — Allure lives under allure/
          # Landing index.html at root links to both
          mkdir -p gh-pages-content/smart/archive

          cp smart-report.html gh-pages-content/smart/index.html
          TIMESTAMP=$(date +%Y-%m-%d-%H%M)
          cp smart-report.html "gh-pages-content/smart/archive/report-${TIMESTAMP}-run${{ github.run_number }}.html"

          # Create/refresh the root landing page
          cat > gh-pages-content/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>OrangeHRM — Test Reports</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 600px; margin: 80px auto; padding: 0 20px; background: #0d1117; color: #e6edf3; }
              h1 { font-size: 1.5rem; border-bottom: 1px solid #30363d; padding-bottom: 12px; }
              .cards { display: grid; gap: 16px; margin-top: 24px; }
              a.card { display: block; padding: 20px 24px; border: 1px solid #30363d; border-radius: 8px; text-decoration: none; color: inherit; background: #161b22; transition: border-color .2s; }
              a.card:hover { border-color: #58a6ff; }
              a.card h2 { margin: 0 0 6px; font-size: 1.1rem; color: #58a6ff; }
              a.card p  { margin: 0; font-size: .875rem; color: #8b949e; }
              .badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:.75rem; background:#1f6feb; color:#fff; margin-left:8px; vertical-align:middle; }
            </style>
          </head>
          <body>
            <h1>vibetestq-pwselfhealingframework <span class="badge">OrangeHRM</span></h1>
            <div class="cards">
              <a class="card" href="smart/index.html">
                <h2>Smart Report</h2>
                <p>History-aware report — trends, flakiness grades, run comparison, trace viewer</p>
              </a>
              <a class="card" href="allure/index.html">
                <h2>Allure Report</h2>
                <p>Full suite report — test steps, attachments, categories, timeline</p>
              </a>
            </div>
          </body>
          </html>
          EOF
          echo "📄 GitHub Pages content prepared"

      # ── 10. Deploy to GitHub Pages ─────────────────────────────────────────
      - name: Deploy to GitHub Pages
        if: always() && (github.ref == 'refs/heads/advreport' || github.ref == 'refs/heads/main')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-content
          keep_files: true             # preserves allure/ and archive/ across deploys
          commit_message: "deploy: smart report — run #${{ github.run_number }} [${{ github.sha }}]"

      # ── 11. Upload artifacts (useful for PRs that don't deploy to Pages) ──
      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-report-run-${{ github.run_number }}
          path: |
            smart-report.html
            test-history-orangehrm-ui.json
          retention-days: 30
