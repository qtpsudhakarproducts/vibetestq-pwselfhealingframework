# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Nightly Regression — Full Suite with Allure History → GitHub Pages
name: Nightly Regression

on:
  schedule:
    - cron: '0 0 * * *'   # midnight UTC every day
  workflow_dispatch:       # allow manual trigger

permissions:
  contents: write          # required to push to gh-pages branch

jobs:
  regression:
    name: Full Regression Suite
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Create auth directory
        run: mkdir -p playwright/.auth

      - name: Create environment file
        run: |
          mkdir -p test-data
          cat > test-data/.env.dev << 'EOF'
          BASE_URL=${{ vars.BASE_URL }}
          ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          ESS_USERNAME=${{ secrets.ESS_USERNAME }}
          ESS_PASSWORD=${{ secrets.ESS_PASSWORD }}
          EOF

      # ─── Restore previous Allure history for trend charts ────────────────────

      - name: Download previous Allure history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Copy Allure history from previous run
        run: |
          if [ -d "gh-pages/allure/history" ]; then
            mkdir -p reports/allure/history
            cp -r gh-pages/allure/history reports/allure/
            echo "✅ Allure history restored from previous run"
          elif [ -d "gh-pages/history" ]; then
            mkdir -p reports/allure/history
            cp -r gh-pages/history reports/allure/
            echo "✅ Allure history restored (legacy path)"
          else
            echo "ℹ️  No previous history found — first run baseline"
          fi

      # ─── Run tests ───────────────────────────────────────────────────────────

      - name: Run full regression suite
        run: npx playwright test
        env:
          CI: true
          TEST_ENV: dev
          # Runtime self-healing — nightly only
          ENABLE_RUNTIME_HEALING: 'true'
          HEAL_LLM_PROVIDER: 'anthropic'
          HEAL_LLM_MODEL: 'claude-sonnet-4-20250514'
          HEAL_LLM_API_KEY: ${{ secrets.HEAL_LLM_API_KEY }}
        continue-on-error: true  # publish report even when tests fail

      # ─── Generate Allure Report ───────────────────────────────────────────────

      - name: Generate Allure HTML report
        run: npx allure generate reports/allure --clean -o reports/allure-html
        if: always()

      # ─── Publish to GitHub Pages ────────────────────────────────────────────

      - name: Prepare gh-pages directory structure
        if: always()
        run: |
          mkdir -p gh-pages-deploy/allure
          cp -r reports/allure-html/. gh-pages-deploy/allure/

      - name: Publish report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          personal_token: ${{ secrets.GH_PAT }}
          publish_branch: gh-pages
          publish_dir: gh-pages-deploy
          keep_files: true
          commit_message: |
            📊 Nightly regression report — run ${{ github.run_number }}

      # ─── Upload Playwright artifacts as backup ────────────────────────────────

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-nightly-${{ github.run_number }}
          path: reports/html/
          retention-days: 30

      - name: Upload test results JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_number }}
          path: test-results/results.json
          retention-days: 30
      - name: Upload self-healing log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: healing-log-${{ github.run_number }}
          path: healing-log.json
          retention-days: 30