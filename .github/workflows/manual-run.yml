# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Manual Run — configurable tag and environment
name: Manual Run

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag filter (e.g. @smoke, @pim, @critical)'
        required: false
        default: '@smoke'
        type: string
      environment:
        description: 'Test environment'
        required: false
        default: 'dev'
        type: choice
        options:
          - dev
          - staging

permissions:
  contents: write

jobs:
  manual:
    name: Manual Test Run
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Create auth directory
        run: mkdir -p playwright/.auth

      - name: Create environment file
        run: |
          mkdir -p test-data
          cat > test-data/.env.${{ github.event.inputs.environment }} << 'EOF'
          BASE_URL=https://opensource-demo.orangehrmlive.com
          ADMIN_USERNAME=Admin
          ADMIN_PASSWORD=admin123
          ESS_USERNAME=alice.johnson
          ESS_PASSWORD=Alice@1234
          EOF

      - name: Run tests — tag ${{ github.event.inputs.tag }}
        run: npx playwright test --grep "${{ github.event.inputs.tag }}"
        env:
          CI: true
          TEST_ENV: ${{ github.event.inputs.environment }}
        continue-on-error: true

      - name: Generate Allure report
        run: npx allure generate allure-results --clean -o allure-report
        if: always()

      - name: Prepare gh-pages directory structure
        if: always()
        run: |
          mkdir -p gh-pages-deploy/allure
          cp -r allure-report/. gh-pages-deploy/allure/

      - name: Publish report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          personal_token: ${{ secrets.GH_PAT }}
          publish_branch: gh-pages
          publish_dir: gh-pages-deploy
          keep_files: true
          commit_message: |
            📊 Manual run — tag ${{ github.event.inputs.tag }} — run ${{ github.run_number }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-manual-${{ github.run_number }}
          path: playwright-report/
          retention-days: 14
